# Cue 偏差复核台编排：
#   web     —— Fastify（API + 已构建页面），宿主端口由 WEB_PORT 覆盖，默认 8080
#   verify  —— 一次性验收服务，跑完退出；不发布端口
#
# 用法：
#   WEB_PORT=9090 docker compose up --build web
#   docker compose run --rm verify          # 单元测试 + 验收
#   docker compose run --rm verify npm test # 仅 Vitest

services:
  web:
    build:
      context: .
      target: runtime
    image: cue-deviation:runtime
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      # 宿主侧可用 WEB_PORT 覆盖；容器内固定监听 8080
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: cue-deviation:verify
    depends_on:
      - web
    # 一次性：构建产物 + 单元测试 + 验收脚本顺序执行
    command:
      - sh
      - -c
      - "npm test && node scripts/acceptance.mjs"
    restart: "no"
